[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reachtrace"
version = "0.1.0"
description = "Provenance attribution of RLVR reasoning gains on the fully open Olmo 3 model flow"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Govind Arun Kumar", email = "govind02@umd.edu" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyarrow>=15",
  "pyyaml>=6",
  "pydantic>=2.6",
  "typer>=0.12",
  "jinja2>=3.1",
  "huggingface_hub>=0.34",
]

[project.optional-dependencies]
# Each heavy stage is an extra so the analysis core stays CPU-installable.
# vllm 0.32 pins transformers>=5.16.1,<5.20 and bergson>=2.3 needs transformers>=5.0,
# so `sample` and `attrib` can share one GPU environment (verified 2026-10-22).
grade = ["math-verify>=0.8"]
data = ["datasets>=3.0"]
sample = ["vllm>=0.32,<0.33", "math-verify>=0.8", "datasets>=3.0"]
attrib = ["bergson>=2.3.0", "datasets>=3.0"]
synth = ["torch>=2.5", "transformers>=5.0", "trl>=1.0", "datasets>=3.0"]
embed = ["sentence-transformers>=3.0"]
remote = ["modal>=1.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
reachtrace = "reachtrace.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/reachtrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"src/reachtrace/cli.py" = ["B008"]  # typer.Option defaults are the documented Typer idiom
"tests/*" = ["E501"]  # verbatim template and fixture strings
